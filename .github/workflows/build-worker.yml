name: Build worker image

# Builds the RunPod GPU worker in GitHub's cloud and pushes it to GitHub Container Registry.
# Uses no space on your Mac.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/build-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # GitHub runners ship with ~14 GB free; the CUDA/PyTorch image needs more.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/avatar-studio-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
